<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Album selection demo | Error Studio</title><style>
:root{color-scheme:dark;--bg:#111110;--panel:#1c1c1a;--ink:#f8f4e9;--muted:#b6b3a8;--gold:#f4b329;--line:#37372f;--red:#ff5656}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif;font-size:15px;line-height:1.5}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:4px}button:disabled{opacity:.45;cursor:not-allowed}.demo{background:#f1e9d9;color:#29251c;padding:12px 20px;text-align:center;font-size:12px;line-height:1.55}.demo strong{letter-spacing:.08em}.wrap{max-width:1080px;margin:auto;padding:28px 24px 150px}.brand{font-size:12px;letter-spacing:.24em;font-weight:bold;display:flex;justify-content:space-between;align-items:center}.brand span:last-child{font-weight:normal;letter-spacing:0;color:var(--muted);font-size:12px}.intro{max-width:640px;margin-top:40px}.eyebrow{text-transform:uppercase;color:var(--gold);font-size:11px;font-weight:bold;letter-spacing:.2em}h1{font:normal 48px/1.1 Georgia,serif;letter-spacing:-.025em;margin:12px 0 18px}h2{font:normal 30px/1.15 Georgia,serif;margin:0 0 12px}p{margin:0 0 16px}.muted{color:var(--muted)}.notice{border-left:2px solid var(--gold);padding:8px 14px;margin:24px 0;color:var(--muted);font-size:13px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-top:1px solid var(--line);padding:24px 0 18px;margin-top:30px}.tabs{display:flex;gap:8px}.tab,.plain{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:24px;padding:10px 16px;min-height:44px}.tab[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px 14px}.tile{position:relative;min-width:0}.open{padding:0;border:0;background:var(--panel);width:100%;display:block;overflow:hidden;border-radius:10px}.art{aspect-ratio:4/5;width:100%;display:block;transition:transform .25s}.open:hover .art{transform:scale(1.035)}.heart{position:absolute;top:10px;right:10px;width:44px;height:44px;border:1px solid #ffffff55;background:#111110dd;color:#fff;border-radius:50%;font:26px/1 Arial;display:grid;place-items:center}.heart[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#21190a}.caption{padding:10px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}.caption strong{color:var(--ink);font-weight:normal;white-space:nowrap}.selected-label{color:var(--gold)}.dock{position:fixed;bottom:0;left:0;right:0;border-top:1px solid var(--line);background:#181816f5;backdrop-filter:blur(12px);padding:16px 24px max(16px,env(safe-area-inset-bottom));z-index:3}.dock-inner{max-width:1080px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}.dock strong{font-size:17px}.dock small{display:block;color:var(--muted);font-size:11px}.primary{background:var(--gold);color:#20180a;border:0;padding:13px 21px;min-height:48px;border-radius:7px;font-weight:bold}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:40px 22px;text-align:center;border-radius:10px}.review{max-width:700px}.back{background:none;color:var(--muted);border:0;padding:12px 0;margin:10px 0 24px;min-height:44px}.review-list{border-top:1px solid var(--line);margin-top:28px}.review-row{padding:16px 0;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}.mini{width:60px;height:70px;border-radius:6px;overflow:hidden}.mini .art{height:100%;object-fit:cover}.review-row .name{flex:1}.review-row button{min-height:44px;background:transparent;border:0;color:var(--gold);padding:10px}.finish{border:1px solid var(--line);border-radius:12px;padding:26px;margin-top:24px}.tick{font-size:28px;color:var(--gold);margin-bottom:16px}dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;width:min(720px,calc(100% - 24px));max-height:95dvh;padding:16px}dialog::backdrop{background:#000d}.viewer-top,.viewer-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}.viewer-stage{max-width:430px;margin:15px auto}.viewer-stage .art{max-height:62dvh;object-fit:contain}.viewer-bottom .heart{position:static;flex-shrink:0}.nav{min-width:48px;min-height:48px;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:24px}#status{min-height:22px;font-size:12px;color:var(--gold);margin:12px 0}.storage{color:var(--muted);font-size:11px;margin-top:24px}.reset{border:0;padding:10px 0;min-height:44px;color:var(--muted);text-decoration:underline;background:none}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:24px 20px 150px}.brand{font-size:11px;letter-spacing:.18em}.brand span:last-child{font-size:10px}.intro{margin-top:32px}h1{font-size:39px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.caption{font-size:10px;align-items:flex-start;flex-direction:column;gap:2px}.toolbar{gap:12px}.tabs{width:100%}.tab{flex:1;padding:10px 8px;font-size:13px}.dock{padding:14px 20px max(14px,env(safe-area-inset-bottom))}.dock strong{font-size:15px}.primary{padding:13px 16px;font-size:13px}.heart{right:8px;top:8px}.notice{font-size:12px}.review-row{gap:10px}}
</style></head><body>
<div class="demo"><strong>INTERACTIVE DEMO</strong> · Placeholder images only<br>No Drive connection. Nothing is sent to the studio.</div>
<main class="wrap"><header class="brand"><span>ERROR STUDIO</span><span>Album selection preview</span></header><div id="screen"></div><p id="status" role="status" aria-live="polite"></p></main>
<div id="dock" class="dock"></div>
<dialog id="viewer" aria-label="Preview sample image"><div class="viewer-top"><span id="viewer-name"></span><button class="plain" id="close">Close ×</button></div><div class="viewer-stage" id="viewer-art"></div><div class="viewer-bottom"><button class="nav" id="prev" aria-label="Previous image">‹</button><button class="plain" id="viewer-heart"></button><button class="nav" id="next" aria-label="Next image">›</button></div></dialog>
<script>
'use strict';
const KEY='error-studio-album-demo-v1';
const photos=Array.from({length:8},(_,i)=>({id:'sample-'+String(i+1).padStart(2,'0'),name:'SAMPLE_'+String(i+1).padStart(3,'0')+'.JPG',n:i+1}));
let selected=new Set(),filter='all',screen='grid',active=0,storageOK=true,restored=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.version===1){selected=new Set((saved.ids||[]).filter(id=>photos.some(p=>p.id===id)));screen=saved.finalised?'done':'grid';restored=selected.size>0;}}catch(e){storageOK=false;}
const el=id=>document.getElementById(id);
function art(p){const palette=[['#9b795d','#453b30'],['#6d7565','#29352d'],['#a68976','#5e5145'],['#738182','#37484b']][(p.n-1)%4];return `<svg class="art" viewBox="0 0 400 500" role="img" aria-label="Placeholder image ${p.n}, not a client photo" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g${p.n}" x2="1" y2="1"><stop stop-color="${palette[0]}"/><stop offset="1" stop-color="${palette[1]}"/></linearGradient></defs><rect width="400" height="500" fill="url(#g${p.n})"/><circle cx="${80+p.n*23}" cy="140" r="95" fill="#f4e9ce" opacity=".15"/><path d="M40 500V290a160 160 0 01320 0v210" fill="none" stroke="#f4e9ce" stroke-width="2" opacity=".35"/><path d="M80 500V310a120 120 0 01240 0v190" fill="none" stroke="#f4e9ce" stroke-width="2" opacity=".2"/><text x="200" y="270" text-anchor="middle" fill="#fff8e8" font-family="Georgia,serif" font-size="66">${String(p.n).padStart(2,'0')}</text><text x="200" y="312" text-anchor="middle" fill="#fff8e8" font-family="Arial,sans-serif" font-size="14" letter-spacing="4">SAMPLE IMAGE</text><text x="200" y="465" text-anchor="middle" fill="#fff8e8" opacity=".7" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">PLACEHOLDER · NO CLIENT PHOTO</text></svg>`;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({version:1,ids:[...selected],finalised:screen==='done'}));storageOK=true;}catch(e){storageOK=false;}}
function notice(){return `<div class="notice">${storageOK?'Draft saved in this browser only. Clearing browser data removes it. No cross-device sync.':'Browser saving unavailable. Keep this page open; your choices may be lost on refresh.'}<br>Demo only: no client album, no upload, no studio submission.</div>`;}
function tell(t){el('status').textContent=t;}
function toggle(id){if(screen==='done')return;if(selected.has(id))selected.delete(id);else selected.add(id);save();render();if(el('viewer').open)renderViewer();tell(`${selected.size} selected. ${storageOK?'Saved in this browser only.':'Not saved to this browser.'}`);}
function tile(p){const yes=selected.has(p.id);return `<article class="tile"><button class="open" data-open="${p.id}" aria-label="View ${p.name}">${art(p)}</button><button class="heart" data-heart="${p.id}" aria-label="${yes?'Unselect':'Select'} ${p.name}" aria-pressed="${yes}">${yes?'♥':'♡'}</button><div class="caption"><strong>${p.name}</strong><span class="${yes?'selected-label':''}">${yes?'♥ Selected':'Tap heart to select'}</span></div></article>`;}
function render(){const count=selected.size;let html='';
if(screen==='grid')html=`<section class="intro"><p class="eyebrow">Your favourites, together</p><h1>Choose the photos<br>you love.</h1><p class="muted">Tap a heart to shortlist a photo for your album. Open any image for a closer look.</p></section>${notice()}<div class="toolbar"><div class="tabs" aria-label="Filter photos"><button class="tab" data-filter="all" aria-pressed="${filter==='all'}">All photos · ${photos.length}</button><button class="tab" data-filter="selected" aria-pressed="${filter==='selected'}">Selected · ${count}</button></div><span class="muted" style="font-size:12px">8 sample images · no real album</span></div><section class="grid" aria-label="Sample photo grid">${photos.filter(p=>filter==='all'||selected.has(p.id)).map(tile).join('')||( '<div class="empty"><h2>No favourites yet.</h2><p class="muted">Choose All photos, then tap a heart.</p><button class="plain" data-filter="all">See all photos</button></div>')}</section><p class="storage">This preview uses generated graphic placeholders, not photographs.</p><button class="reset" id="reset">Reset demo choices</button>`;
else if(screen==='review')html=`<section class="review"><button class="back" id="back">← Back to photos</button><p class="eyebrow">One last look</p><h1>Review your<br>${count} selection${count===1?'':'s'}.</h1><p class="muted">Remove anything you do not want. You can return to the grid and add more.</p>${notice()}<div class="review-list">${photos.filter(p=>selected.has(p.id)).map(p=>`<div class="review-row"><div class="mini">${art(p)}</div><div class="name"><strong>${p.name}</strong><br><small class="muted">Sample image ${p.n}</small></div><button data-heart="${p.id}" aria-label="Remove ${p.name}">Remove</button></div>`).join('')||'<div class="empty">No photos selected. Go back to add some.</div>'}</div><p class="storage">Next step completes this demo on this device only. Nothing leaves your browser.</p></section>`;
else html=`<section class="review intro"><p class="eyebrow">Demo complete</p><h1>Your shortlist<br>is ready to review.</h1><div class="finish"><div class="tick" aria-hidden="true">✓</div><h2>${count} sample image${count===1?'':'s'} selected</h2><p><strong>Nothing was sent to Error Studio.</strong></p><p class="muted">This is a local demo. There is no client access system, cloud saving or connected Drive album yet.</p><p class="muted">In the finished service, confirmation will need a real studio receipt. This screen is not that receipt.</p></div>${notice()}<div class="review-list">${photos.filter(p=>selected.has(p.id)).map(p=>`<div class="review-row"><div class="mini">${art(p)}</div><strong>${p.name}</strong></div>`).join('')}</div><p class="storage">You can reopen this demo to change your shortlist.</p></section>`;
el('screen').innerHTML=html;
el('dock').innerHTML=`<div class="dock-inner"><div><strong>${count} photo${count===1?'':'s'} selected</strong><small>${screen==='done'?'DEMO ONLY · Nothing sent':'Local demo · this browser only'}</small></div><button class="primary" id="continue" ${count===0&&screen!=='done'?'disabled':''}>${screen==='grid'?'Review selection':screen==='review'?'Finish demo':'Reopen demo'}</button></div>`;
document.querySelectorAll('[data-heart]').forEach(b=>b.onclick=()=>toggle(b.dataset.heart));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openViewer(photos.findIndex(p=>p.id===b.dataset.open)));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});if(el('back'))el('back').onclick=()=>{screen='grid';render();window.scrollTo(0,0);};if(el('reset'))el('reset').onclick=()=>{if(!confirm('Clear this demo shortlist from this browser?'))return;selected.clear();save();render();tell('Demo choices cleared.');};el('continue').onclick=()=>{screen=screen==='grid'?'review':screen==='review'?'done':'grid';save();render();window.scrollTo(0,0);tell(screen==='done'?'Demo complete. Nothing was sent to the studio.':'');};}
function openViewer(i){active=i;renderViewer();el('viewer').showModal();}
function renderViewer(){const p=photos[active],yes=selected.has(p.id);el('viewer-name').textContent=`${p.name} · ${active+1} / ${photos.length}`;el('viewer-art').innerHTML=art(p);el('viewer-heart').textContent=(yes?'♥ Selected':'♡ Select photo');el('viewer-heart').setAttribute('aria-pressed',String(yes));el('viewer-heart').onclick=()=>toggle(p.id);}
el('close').onclick=()=>el('viewer').close();el('prev').onclick=()=>{active=(active+photos.length-1)%photos.length;renderViewer();};el('next').onclick=()=>{active=(active+1)%photos.length;renderViewer();};el('viewer').addEventListener('keydown',e=>{if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('prev').click();});render();if(restored)tell('Demo shortlist restored from this browser. Nothing was sent.');
</script></body></html>
